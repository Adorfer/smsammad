[project]
name = "smsammad"
version = "0.1.0"
description = "Bidirektionale Kopplung von Zammad und einem Teltonika-SMS-Gateway"
requires-python = ">=3.10"

# Kein pip install: Abhaengigkeiten kommen aus den Ubuntu-Paketen
# python3-requests, python3-phonenumbers (Laufzeit) sowie
# python3-pytest, python3-responses (Tests). Aufruf per
# `python3 run.py ...` bzw. `pytest`, beides ohne
# vorherige Installation des Pakets selbst (pythonpath s.u.).

[tool.pytest.ini_options]
pythonpath = ["src"]
